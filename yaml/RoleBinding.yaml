apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: multi-group-role-binding
  namespace: demo-ns                  # Must match Role namespace
subjects:
- kind: ServiceAccount                # ServiceAccount identity
  name: app-sa                        # ServiceAccount name
  namespace: demo-ns                  # Namespace where the SA lives

- kind: User                          # Normal user identity
  name: rk                            # Example user (from kubeconfig or external auth)
  apiGroup: rbac.authorization.k8s.io # Required for User/Group subjects

- kind: Group                         # Group identity
  name: dev-team                      # Example group name
  apiGroup: rbac.authorization.k8s.io # Required for User/Group subjects

roleRef:
  kind: Role
  name: multi-group-role              # Reference the Role defined earlier
  apiGroup: rbac.authorization.k8s.io
