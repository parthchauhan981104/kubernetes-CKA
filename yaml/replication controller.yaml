apiVersion: v1
kind: ReplicationController
metadata:
  name: nginx-rc
spec:
  replicas: 3
  # selector omitted → inferred automatically from template labels
  template:
    metadata:
      labels:
        env: demo     # RC will use this label internally
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
