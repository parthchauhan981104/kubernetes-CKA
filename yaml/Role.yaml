apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: multi-group-role
  namespace: demo-ns
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["create", "delete"]
- apiGroups: [""]                     # core group
  resources: ["configmaps"]
  verbs: ["update"]
